<section class="profile-page"><div class="profile-card"><p class="eyebrow">CUENTA</p><h1>Mi perfil</h1><p>Consulta y actualiza tus datos personales.</p><label>Nombre completo<input [(ngModel)]="profile.fullName" /></label><label>Correo electrónico<input [value]="profile.email" disabled /></label><label>Teléfono<input [(ngModel)]="profile.phone" /></label><label>Rol<input [value]="profile.role" disabled /></label><button class="primary" type="button" (click)="save()">Guardar cambios</button><p class="success" *ngIf="message">{{message}}</p><p class="error" *ngIf="error">{{error}}</p></div></section>
