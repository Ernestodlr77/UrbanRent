<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-container">
        <img src="assets/logo.svg" alt="UrbanRent Logo" class="auth-logo-img" />
      </div>
      <h2 class="auth-title">Crear Cuenta</h2>
      <p class="auth-subtitle">Únete a la plataforma de gestión de UrbanRent</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input id="fullName" type="text" formControlName="fullName" class="form-control" placeholder="Ana Martínez" />
      </div>
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="ejemplo@kinal.edu.gt" />
      </div>
      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input id="phone" type="tel" formControlName="phone" class="form-control" placeholder="+502 5555 5555" />
      </div>
      <div class="form-group">
        <label for="roleId">Tipo de Usuario</label>
        <select id="roleId" formControlName="roleId" class="form-control">
          <option value="2">Propietario / Arrendador</option>
          <option value="3">Inquilino / Arrendatario</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="Mínimo 8 caracteres" minlength="8" />
        <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="form-error">La contraseña debe tener al menos 8 caracteres.</p>
      </div>
      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">Registrarme</button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes una cuenta?
      <a routerLink="/login" class="auth-link">Inicia sesión</a>
    </div>
  </div>
</div>
