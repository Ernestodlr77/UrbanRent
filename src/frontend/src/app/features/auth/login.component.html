<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-container">
        <img src="assets/logo.svg" alt="UrbanRent Logo" class="auth-logo-img" />
      </div>
      <h2 class="auth-title">Iniciar Sesión</h2>
      <p class="auth-subtitle">Ingresa a tu cuenta de UrbanRent</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="ejemplo@kinal.edu.gt" />
        <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="form-error">Ingresa un correo electrónico válido.</p>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="••••••••" />
        <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="form-error">La contraseña debe tener al menos 8 caracteres.</p>
      </div>
      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">Ingresar al Sistema</button>
    </form>

    <div class="auth-footer">
      ¿No tienes una cuenta?
      <a routerLink="/register" class="auth-link">Regístrate aquí</a>
    </div>
  </div>
</div>
