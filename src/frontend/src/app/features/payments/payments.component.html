<section class="page"><div class="page-head"><div><p class="eyebrow">COBRANZA</p><h1>Control de pagos</h1><p>Historial y estado de los recibos.</p></div><button class="primary" type="button" (click)="loadPayments()">Actualizar</button></div><div class="table-card"><table><thead><tr><th>ID</th><th>Contrato</th><th>Monto</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let item of payments"><td>#{{item.id}}</td><td>Contrato #{{item.contractId}}</td><td>{{item.amount | number:'1.2-2'}}</td><td>{{item.dueDate | date:'dd/MM/yyyy'}}</td><td><span class="status" [class.late]="item.status==='LATE'">{{statusLabel(item.status)}}</span></td><td><button *ngIf="item.status!=='PAID'" type="button" (click)="markPaid(item)">Marcar pagado</button> <button type="button" (click)="remove(item)">Eliminar</button></td></tr></tbody></table></div></section>
